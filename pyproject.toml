[build-system]
requires = ["setuptools>=71","wheel"]
build-backend = "setuptools.build_meta"

[project]
name="jobhunter"
version="0.1.0"
requires-python=">=3.11"
dependencies=[
    "httpx>=0.26",
    "lxml>=4.9",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "requests>=2.28",
]

[project.scripts]
jobhunter="jobhunter.cli:main"

[tool.setuptools.packages.find]
where=["src"]
