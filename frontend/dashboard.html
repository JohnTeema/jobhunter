<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jobhunter — daily shortlist</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  body { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .score-bar { transition: width 0.6s ease; }
  .tag { background: #e0f2fe; color: #0369a1; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- Embedded data from jobhunter production run → works offline -->
<header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <h1 class="text-xl font-bold text-slate-900">jobhunter</h1>
    <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full mono" id="generatedAt"></span>
  </div>
  <div class="flex items-center gap-3">
    <label class="text-sm text-slate-500">Load:</label>
    <input type="file" id="fileInput" accept=".json"
      class="block text-sm text-slate-600 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
    <button id="refreshBtn"
      class="text-sm bg-blue-600 text-white px-4 py-1.5 rounded-full hover:bg-blue-700 transition font-medium">
      ↻ Refresh
    </button>
  </div>
</header>

<!-- Stats bar -->
<section id="stats" class="bg-white border-b border-slate-200 px-6 py-4 flex gap-8 text-sm opacity-0 transition-opacity">
  <span><b id="totalJobs">0</b> <span class="text-slate-400">roles</span></span>
  <span class="text-emerald-600"><b id="strongCount">0</b> <span class="text-slate-400">strong (7+)</span></span>
  <span class="text-amber-500"><b id="reachCount">0</b> <span class="text-slate-400">reach (5-6)</span></span>
  <span class="text-slate-400">threshold: <b id="threshold">5/10</b></span>
</section>

<!-- Filters -->
<section class="bg-white border-b border-slate-200 px-6 py-3 flex gap-4 items-center flex-wrap">
  <input type="text" id="searchInput" placeholder="Search title, company, tags…"
    class="flex-1 min-w-48 text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 max-w-md" />
  <select id="scoreFilter" class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none">
    <option value="all">All scores</option>
    <option value="strong">Strong (7+)</option>
    <option value="apply">Apply (5+)</option>
  </select>
  <label class="flex items-center gap-1 text-sm text-slate-600">
    <input type="checkbox" id="hideApplied" class="rounded"> Hide applied
  </label>
</section>

<!-- Job list -->
<main class="px-6 py-4 max-w-5xl mx-auto" id="jobList">
  <div id="emptyState" class="text-center py-16 text-slate-400 hidden">
    <p class="text-lg">No roles match yet.</p>
    <p class="text-sm mt-1">Try lowering the score threshold or broadening the role filters.</p>
  </div>
  <div id="cardList" class="space-y-3"></div>
</main>

<!-- Detail modal -->
<p class="text-xs text-slate-400 mt-2 mb-1 hidden" id="embedNote">Data embedded — click Refresh to re-run jobhunter first</p>
  <dialog id="modal" class="p-0 bg-white rounded-2xl shadow-2xl max-w-2xl w-[90vw] max-h-[85vh] overflow-hidden">
  <form method="dialog" class="flex flex-col h-full">
    <header class="px-6 py-4 border-b border-slate-200 flex items-start justify-between gap-4">
      <div>
        <h2 class="text-lg font-bold text-slate-900" id="modalTitle"></h2>
        <p class="text-slate-500 text-sm mt-0.5" id="modalCompany"></p>
      </div>
      <button class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
    </header>
    <div class="px-6 py-4 space-y-4 overflow-y-auto flex-1" id="modalBody"></div>
    <footer class="px-6 py-3 border-t border-slate-200 flex justify-end gap-3 bg-slate-50">
      <a id="modalSource" href="#" target="_blank"
        class="text-sm bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium">
        Open source ↗
      </a>
      <button class="text-sm bg-slate-200 text-slate-700 px-4 py-2 rounded-lg hover:bg-slate-300">
        Close
      </button>
    </footer>
  </form>
</dialog>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
function scoreColor(s) {
  if (s >= 8) return { bar: 'bg-emerald-500', text: 'text-emerald-700', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
  if (s >= 6) return { bar: 'bg-blue-500',    text: 'text-blue-700',    badge: 'bg-blue-50    text-blue-700    border-blue-200' };
  return           { bar: 'bg-amber-400',     text: 'text-amber-700',   badge: 'bg-amber-50  text-amber-700  border-amber-200' };
}
const TAG_COLORS = ['#dbeafe','#fce7f3','#f0fdf4','#fef9c3','#ede9fe','#fff7ed','#ccfbf1','#fee2e2'];

let data = {};

// ── render ────────────────────────────────────────────────────────────────────
function render(list) {
  const container = document.getElementById('cardList');
  container.innerHTML = '';
  if (!list.length) {
    document.getElementById('emptyState').classList.remove('hidden');
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');

  for (const j of list) {
    const s = scoreColor(j.score);
    const tags = (j.tags || []).map((t, i) =>
      `<span class="tag text-xs px-2 py-0.5 rounded-full mr-1 mb-1" style="background:${TAG_COLORS[i % TAG_COLORS.length]};color:#374151">${escHtml(t)}</span>`
    ).join('');
    const notePreview = (j.personal_note || '').substring(0, 160) + ('…' || '');

    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl border border-slate-200 p-4 hover:shadow-md transition-shadow cursor-pointer';
    card.innerHTML = `
      <div class="flex gap-4 items-start">
        <!-- score -->
        <div class="flex-shrink-0 w-12 h-12 flex flex-col items-center justify-center rounded-xl ${s.badge} border">
          <span class="text-xl font-bold ${s.text}">${j.score}</span>
          <span class="text-[9px] uppercase tracking-wider text-slate-400 mt-0.5">fit</span>
        </div>
        <!-- content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-semibold text-slate-900 leading-snug">${escHtml(j.title)}</h3>
              <p class="text-sm text-slate-500 mt-0.5">${escHtml(j.company)} · ${escHtml(j.location || 'Remote')}</p>
            </div>
            <span class="mono text-xs text-slate-400 flex-shrink-0">${escHtml(j.source || '')}</span>
          </div>
          <div class="mt-2 flex gap-2 flex-wrap text-xs">
            ${j.salary_raw ? `<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 mono">${escHtml(j.salary_raw)}</span>` : ''}
            ${tags}
          </div>
          <p class="mt-2 text-sm text-slate-500 leading-relaxed">${notePreview}</p>
           <!-- score bar -->
          <div class="mt-2 h-1 w-full bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full ${s.bar} score-bar rounded-full" style="width:${j.score * 10}%"></div>
          </div>
        </div>
        <!-- apply -->
        <div class="flex-shrink-0">
          <a href="${escHtml(j.source_url)}" target="_blank"
            class="inline-flex items-center gap-1 text-sm bg-slate-900 text-white px-3 py-1.5 rounded-lg hover:bg-slate-700 font-medium">
            Apply <span class="text-xs">↗</span>
          </a>
        </div>
      </div>`;
    card.addEventListener('click', (e) => { if (e.target.tagName !== 'A') openModal(j); });
    container.appendChild(card);
  }
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getJobs() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const sf = document.getElementById('scoreFilter').value;
  const hideApplied = document.getElementById('hideApplied').checked;
  return (data.jobs || []).filter(j => {
    const hay = `${j.title} ${j.company} ${j.location} ${(j.tags||[]).join(' ')}`.toLowerCase();
    if (search && !hay.includes(search)) return false;
    if (sf === 'strong' && j.score < 7) return false;
    if (sf === 'apply'   && j.score < 5) return false;
    return true;
  });
}

function refresh() {
  const search = document.getElementById('searchInput').value;
  render(getJobs());
  document.getElementById('stats').style.opacity = '1';
  const jobs = data.jobs || [];
  document.getElementById('totalJobs').textContent = jobs.length;
  document.getElementById('strongCount').textContent = jobs.filter(j => j.score >= 7).length;
  document.getElementById('reachCount').textContent  = jobs.filter(j => j.score < 7 && j.score >= 5).length;
  document.getElementById('threshold').textContent   = `${data.criteria ? data.criteria.split('score>=' )[1]?.split(' ')[0] || '5' : '5'}/10`;
  document.getElementById('generatedAt').textContent = data.generated_at || '';
}

document.getElementById('searchInput').addEventListener('input', refresh);
document.getElementById('scoreFilter').addEventListener('change', refresh);
document.getElementById('hideApplied').addEventListener('change', refresh);

// ── file loading ──────────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function (e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { data = JSON.parse(ev.target.result); refresh(); };
  r.readAsText(f);
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  try {
    const r = await fetch('./daily.json');
    data = await r.json();
    refresh();
  } catch(err) {
    alert('Could not load daily.json — click "Load" and pick the file from your output/ folder.');
  }
});

// ── modal ─────────────────────────────────────────────────────────────────────
function openModal(j) {
  document.getElementById('modalTitle').textContent = j.title;
  document.getElementById('modalCompany').textContent = `${j.company} · ${j.location || 'Remote'}`;
  document.getElementById('modalSource').href = j.source_url;
  const s = scoreColor(j.score);
  document.getElementById('modalBody').innerHTML = `
    <div class="flex items-center gap-3">
      <div class="w-14 h-14 flex flex-col items-center justify-center rounded-xl ${s.badge} border">
        <span class="text-2xl font-bold ${s.text}">${j.score}</span>
        <span class="text-[10px] uppercase tracking-wider text-slate-400 mt-0.5">fit</span>
      </div>
      <div class="flex-1">
        <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${s.bar} rounded-full" style="width:${j.score*10}%"></div></div>
        <p class="mt-1 text-sm font-medium">${j.score >= 8 ? '✅ Strong match' : j.score >= 6 ? '👍 Apply' : j.score >= 5 ? '⚡ Reach' : '⚠️ Skip'}</p>
      </div>
    </div>
    ${j.salary_raw ? `<p class="mono text-sm text-slate-700">${escHtml(j.salary_raw)}</p>` : ''}
    <div class="mt-3 space-y-3">
      <div>
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Why you fit</h4>
        <p class="text-sm text-slate-700 leading-relaxed">${escHtml(j.personal_note)}</p>
      </div>
      <div>
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Highlights</h4>
        <ul>${(j.reasons || []).map(r => `<li class="text-sm text-slate-700 before:content-['→'] before:mr-2 before:text-slate-300">${escHtml(r)}</li>`).join('')}</ul>
      </div>
      <div>
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Tags</h4>
        <div>${(j.tags || []).map(t => `<span class="tag text-xs px-2 py-0.5 rounded-full mr-1" style="background:${TAG_COLORS[Math.abs(hash(t)) % TAG_COLORS.length]};color:#374151">${escHtml(t)}</span>`).join('')}</div>
      </div>
    </div>`;
  document.getElementById('modal').showModal();
}
document.querySelector('#modal button[type="button"]').addEventListener('click', () =>
  document.getElementById('modal').close() );
document.querySelector('#modal [method="dialog"] button:last-child').addEventListener('click', () =>
  
  document.getElementById('modal').close() );

</script>
